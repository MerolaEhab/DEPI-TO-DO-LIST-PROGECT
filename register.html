<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CheckMate</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <img src="images/logo.png" alt="CheckMate Logo" class="logo-img">
      <h1>Join CheckMate</h1>
      <p>Take the win and organize your daily workflow.</p>
    </div>

    
    <form action="dashboard.html" method="GET" class="auth-form">
      <div class="form-group">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" name="fullname" placeholder="John Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Repeat password" required>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" required> I agree to the <a href="#" class="forgot-link">Terms & Conditions</a>
        </label>
      </div>

      <button type="submit" class="btn-submit">Create Account</button>
    </form>

    <div class="switch-auth">
      Already have an account? <a href="login.html">Log In</a>
    </div>
  </div>

</body>
</html>
